[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtu-academic-assistant-api"
version = "0.1.0"
description = "FastAPI services for the DTU Academic Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.1,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]
