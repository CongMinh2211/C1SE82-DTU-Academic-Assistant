name: API checks
on:
  push:
    branches: ["member/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install ruff==0.11.13
      - run: python -m ruff check --select E9,F63,F7,F82 app tests
      - run: python -m pytest -q --junitxml=pytest.xml
      - name: API smoke test
        run: python -m pytest -q tests/test_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest
          path: apps/api/pytest.xml
          if-no-files-found: ignore
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Hai nhãn chưa gắn input trong trang login của FE đang chờ chủ sở hữu sửa.
      - run: npx --yes @biomejs/biome@1.9.4 lint src --diagnostic-level=error --skip=lint/a11y/noLabelWithoutControl
      - run: npm run typecheck
      - run: npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Từ chối file môi trường được đưa vào Git
        shell: bash
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Phát hiện file môi trường không được commit:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: Quét secrets trong lịch sử Git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
